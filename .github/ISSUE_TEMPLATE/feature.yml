name: Feature / Requirement
description: Request a product or engineering capability.
title: "feat: "
labels:
  - type:requirement
  - status:triage
  - ai-needs-context
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or engineering problem does this solve?
    validations:
      required: true
  - type: textarea
    id: desired_behavior
    attributes:
      label: Desired behavior
      description: Describe the expected behavior and user-facing result.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: Compatibility, architecture, UX, i18n, agent, or data-contract constraints.
      placeholder: "- Reuse existing flows\n- Preserve saved project compatibility\n- UI copy must use i18n"
  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
      placeholder: "- Included:\n- Excluded:"
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: "- [ ] ...\n- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: related
    attributes:
      label: Related issues, wiki pages, and files
      placeholder: "- Issue: #...\n- Wiki: .project-wiki/...\n- Files: packages/..."
  - type: textarea
    id: pre_submission_investigation
    attributes:
      label: Pre-submission investigation
      description: Record the code, docs, wiki pages, commits, issues, or Project objects checked before filing.
      placeholder: "- Checked files/modules:\n- Checked wiki/harness docs:\n- Assumptions:\n- Open questions:"
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Risk level
      options:
        - risk:low
        - risk:medium
        - risk:high
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      placeholder: "- [ ] Automated tests\n- [ ] Manual check\n- [ ] Regression surface checked"
    validations:
      required: true
  - type: dropdown
    id: task_size
    attributes:
      label: Task size
      options:
        - S
        - M
        - L
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and parallel-work boundaries
      description: Record blocked-by, depends-on-merge, external-owner, and conflicts-with. Write "None" when empty.
    validations:
      required: true
  - type: textarea
    id: effect_tracking
    attributes:
      label: Effect tracking
      description: For runtime, product, operational, or user-facing changes, describe the 24-48 hour validation task or why this is exempt.
      placeholder: "- Tracking issue/task: #...\n- Target environment:\n- Success/failure signals:\n- Owner/deadline:\n- Exemption reason:"
